{%load static%}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{%static 'home/css/user/login.css'%}">
    <title>Biblioteca-Digital</title>
</head>
<body>
    <div class="content">
        <div class="content-main">
            <div class="content-image">
                <img src="{%static 'home/images/capa/biblioteca.png'%}" alt="Logo da biblioteca.web">
            </div>

            <div class="content-form">
                <h1>Login</h1>
                <form action="{%url 'verificar_login'%}" method="POST" class="formulario">
                    {%csrf_token%}
                    <div class="field-group">
                        <input type="email" name="email" placeholder="E-mail" required>
                    </div>
                    <div class="field-group">
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>
                    {%if messages%}
                    <ul class="form-messages" role="alert">
                        {%for message in messages%}
                        <li class="{{message.tags}}">{{message}}</li>
                        {%endfor%}
                    </ul>
                    {%endif%}
                    <div class="btn">
                        <button type="submit">Entrar</button>
                    </div>
                </form>

                <section>
                    <a href="{%url 'formulario_cadastro'%}">Cadastre-se</a>
                </section>

                <!-- <div class="alternativas">
                    <ion-icon name="logo-google"></ion-icon>
                    <ion-icon name="phone-portrait-outline"></ion-icon>
                    <ion-icon name="key-outline"></ion-icon>
                </div> -->
            </div>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
